name: Generate Snake Animation

# Regenerates the contribution "snake" SVGs and pushes them to the `output`
# branch. The README references those SVGs via raw.githubusercontent URLs.
on:
  schedule:
    # Daily, at an off-peak minute to avoid the top-of-hour rush.
    - cron: "17 3 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Regenerate whenever the profile is updated.
  push:
    branches:
      - main

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#58a6ff&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
